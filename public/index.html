<!DOCTYPE html>
<html lang="zh-Hant">
<head>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "PingFang HK", "Microsoft JhengHei", sans-serif; }
    .checkerboard {
      background-color: #f8fafc;
      background-image: linear-gradient(45deg, #e2e8f0 25%, transparent 25%),
        linear-gradient(-45deg, #e2e8f0 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #e2e8f0 75%),
        linear-gradient(-45deg, transparent 75%, #e2e8f0 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0;
    }
    @page {
      size: A4 portrait;
      margin: 0;
    }
    @media print {
      html, body {
        width: 210mm !important;
        height: 274mm !important;
        margin: 0 !important;
        padding: 0 !important;
        background: #ffffff !important;
        overflow: hidden !important;
      }
      body > *:not(#print-area) {
        display: none !important;
      }
      #print-area {
        display: block !important;
        position: static !important;
        width: 210mm !important;
        height: 274mm !important;
        margin: 0 !important;
        padding: 0 !important;
        overflow: hidden !important;
        background: #ffffff !important;
      }
      #print-area img {
        display: block !important;
        width: 210mm !important;
        height: 274mm !important;
        object-fit: contain !important;
        margin: 0 !important;
        padding: 0 !important;
      }
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

  <header class="bg-white border-b border-slate-200 sticky top-0 z-30">
    <div class="max-w-5xl mx-auto px-4 py-3.5 flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-xl bg-indigo-600 text-white flex items-center justify-center font-bold text-lg shadow-sm">
          紙
        </div>
        <div>
          <h1 class="font-bold text-lg text-slate-900 leading-tight">家長學習教室｜工作紙一鍵還原</h1>
          <p class="text-xs text-slate-500">智能識別並拆除鉛筆答案、手畫圈選與紅筆批改，原樣保留印刷題目與插圖</p>
        </div>
      </div>
      <div class="text-xs bg-emerald-50 text-emerald-700 px-3 py-1.5 rounded-full font-medium">
        智能結構擦除引擎（秒速・免費）
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-5xl w-full mx-auto px-4 py-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
    <div class="lg:col-span-5 space-y-5">
      <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
        <div class="flex items-center gap-2 mb-3">
          <span class="w-6 h-6 rounded-full bg-indigo-600 text-white text-xs font-bold flex items-center justify-center">1</span>
          <h2 class="font-bold text-slate-800">上傳已作答的工作紙照片</h2>
        </div>

        <button type="button" id="upload-trigger" class="w-full border-2 border-dashed border-slate-300 hover:border-indigo-500 rounded-xl p-6 flex flex-col items-center justify-center text-center cursor-pointer transition bg-slate-50/60 hover:bg-indigo-50/30">
          <svg class="w-10 h-10 text-indigo-500 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
          </svg>
          <span class="text-sm font-semibold text-slate-700">點擊拍照或從相簿選擇圖片</span>
          <span class="text-xs text-slate-400 mt-1">支援 iPhone 相簿、JPG、PNG（建議正面拍攝）</span>
        </button>
        <input id="file-input" type="file" accept="image/*" class="hidden" />
        <p id="file-name" class="text-xs text-emerald-600 font-medium mt-2 hidden"></p>
      </div>

      <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
        <div class="flex items-center gap-2 mb-3">
          <span class="w-6 h-6 rounded-full bg-indigo-600 text-white text-xs font-bold flex items-center justify-center">2</span>
          <h2 class="font-bold text-slate-800">自動拆除項目</h2>
        </div>

        <div class="space-y-2.5 text-sm">
          <label class="flex items-start gap-2.5 p-2.5 rounded-xl bg-slate-50 border border-slate-100 cursor-pointer">
            <input id="opt-red" type="checkbox" checked class="mt-0.5 rounded text-indigo-600" />
            <div>
              <span class="font-semibold text-slate-800 block">徹底拆除老師紅筆打叉（✗）、剔號（√）與藍筆</span>
              <span class="text-xs text-slate-500">YCbCr 色度分離 + 形態學膨脹，清除彩色批改不留痕</span>
            </div>
          </label>

          <label class="flex items-start gap-2.5 p-2.5 rounded-xl bg-slate-50 border border-slate-100 cursor-pointer">
            <input id="opt-pencil" type="checkbox" checked class="mt-0.5 rounded text-indigo-600" />
            <div>
              <span class="font-semibold text-slate-800 block">連通域幾何分析：拆除鉛筆填空字跡與手畫圓圈</span>
              <span class="text-xs text-slate-500">自動識別並抹除手寫筆劃與圈選，完整保留印刷文字與插圖</span>
            </div>
          </label>

          <label class="flex items-start gap-2.5 p-2.5 rounded-xl bg-slate-50 border border-slate-100 cursor-pointer">
            <input id="opt-white" type="checkbox" checked class="mt-0.5 rounded text-indigo-600" />
            <div>
              <span class="font-semibold text-slate-800 block">純白省墨底色 + 印刷黑字原樣保護</span>
              <span class="text-xs text-slate-500">只漂白紙張底色，絕不減淡原有題目文字與插圖</span>
            </div>
          </label>
        </div>

        <button id="restore-btn" disabled class="mt-5 w-full py-3.5 px-4 rounded-xl bg-indigo-600 hover:bg-indigo-700 disabled:bg-slate-300 disabled:cursor-not-allowed text-white font-bold text-base shadow-sm transition flex items-center justify-center gap-2">
          <span>✨ 一鍵還原空白工作紙</span>
        </button>
      </div>
    </div>

    <div class="lg:col-span-7 flex flex-col">
      <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 flex-1 flex flex-col">
        <div class="flex items-center justify-between mb-3">
          <div class="flex items-center gap-2">
            <span class="w-6 h-6 rounded-full bg-indigo-600 text-white text-xs font-bold flex items-center justify-center">3</span>
            <h2 class="font-bold text-slate-800">移除前 / 移除後 1:1 對比與列印</h2>
          </div>
          <span id="status-badge" class="text-xs text-slate-400">請先在左側上傳照片</span>
        </div>

        <div id="preview-wrapper" class="relative flex-1 min-h-[480px] rounded-xl border border-slate-200 checkerboard overflow-hidden flex items-center justify-center select-none">
          <div id="empty-placeholder" class="text-center p-6 text-slate-400">
            <p class="text-sm font-medium">還原後的純白空白工作紙將顯示在這裡</p>
            <p class="text-xs mt-1">支援左右滑桿直接對比「移除前」與「移除後」效果</p>
          </div>

          <img id="single-preview" class="hidden max-h-[560px] w-auto object-contain" alt="工作紙預覽" />

          <div id="compare-container" class="hidden relative w-full h-[560px] overflow-hidden bg-white">
            <img id="after-img" class="absolute inset-0 w-full h-full object-contain bg-white pointer-events-none" alt="移除後" />
            <div id="before-clip" class="absolute top-0 left-0 bottom-0 overflow-hidden pointer-events-none" style="width: 50%;">
              <img id="before-img" class="max-w-none h-full object-contain bg-white" alt="移除前" />
            </div>
            <div id="slider-line" class="absolute top-0 bottom-0 w-0.5 bg-indigo-600 shadow-md cursor-ew-resize z-10" style="left: 50%;">
              <div class="w-9 h-9 rounded-full bg-indigo-600 text-white text-xs font-bold flex items-center justify-center shadow-lg -ml-[17px] mt-64 border-2 border-white">
                ↔
              </div>
            </div>
            <span class="absolute top-3 left-3 bg-black/65 text-white text-xs px-2.5 py-1 rounded-md z-10 pointer-events-none">移除前</span>
            <span class="absolute top-3 right-3 bg-indigo-600 text-white text-xs px-2.5 py-1 rounded-md z-10 pointer-events-none">移除後（標準 A4）</span>
          </div>
        </div>

        <div id="action-bar" class="hidden mt-4 space-y-2.5">
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
            <button id="download-png-btn" class="py-2.5 px-4 rounded-xl bg-slate-800 hover:bg-slate-900 text-white font-semibold text-sm transition">
              📥 儲存 A4 PNG 圖片
            </button>
            <button id="download-pdf-btn" class="py-2.5 px-4 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-semibold text-sm transition">
              📄 匯出 A4 PDF 檔
            </button>
            <button id="print-btn" class="py-2.5 px-4 rounded-xl bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-semibold text-sm border border-indigo-200 transition">
              🖨️ 直接列印 A4
            </button>
          </div>
          <p class="text-xs text-slate-500 text-center">
            💡 手機提示：點擊「儲存 A4 PNG」可選「儲存影像」存入相簿；點擊「匯出 PDF」會直接跳出「下載」儲存單一 PDF 檔
          </p>
        </div>
      </div>
    </div>
  </main>

  <div id="print-area" class="hidden">
    <img id="print-img" src="" alt="列印工作紙" />
  </div>

  <iframe id="pdf-print-frame" class="hidden" style="width:0;height:0;border:0;"></iframe>

  <footer class="text-center text-xs text-slate-400 py-5 border-t border-slate-200 bg-white mt-8">
    家長學習教室 出品｜專為中小學家長打造的省墨重做練習小工具
  </footer>

  <script>
    const uploadTrigger = document.getElementById('upload-trigger');
    const fileInput = document.getElementById('file-input');
    const fileNameEl = document.getElementById('file-name');
    const restoreBtn = document.getElementById('restore-btn');
    const emptyPlaceholder = document.getElementById('empty-placeholder');
    const singlePreview = document.getElementById('single-preview');
    const compareContainer = document.getElementById('compare-container');
    const beforeImg = document.getElementById('before-img');
    const afterImg = document.getElementById('after-img');
    const beforeClip = document.getElementById('before-clip');
    const sliderLine = document.getElementById('slider-line');
    const actionBar = document.getElementById('action-bar');
    const statusBadge = document.getElementById('status-badge');

    let loadedImageObj = null;
    let originalA4DataUrl = '';
    let restoredA4DataUrl = '';

    function fitImageToStandardA4Canvas(sourceCanvasOrImg) {
      const A4_W = 1240;
      const A4_H = 1754;
      const MARGIN = 16;

      const a4Canvas = document.createElement('canvas');
      a4Canvas.width = A4_W;
      a4Canvas.height = A4_H;
      const ctx = a4Canvas.getContext('2d');

      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(0, 0, A4_W, A4_H);

      const srcW = sourceCanvasOrImg.width;
      const srcH = sourceCanvasOrImg.height;
      const availW = A4_W - MARGIN * 2;
      const availH = A4_H - MARGIN * 2;

      const scale = Math.min(availW / srcW, availH / srcH);
      const drawW = Math.round(srcW * scale);
      const drawH = Math.round(srcH * scale);
      const offsetX = Math.round((A4_W - drawW) / 2);
      const offsetY = Math.round((A4_H - drawH) / 2);

      ctx.drawImage(sourceCanvasOrImg, offsetX, offsetY, drawW, drawH);
      return a4Canvas;
    }

    function syncExactDimensions() {
      if (!compareContainer.classList.contains('hidden')) {
        const w = compareContainer.getBoundingClientRect().width;
        const h = compareContainer.getBoundingClientRect().height;
        beforeImg.style.width = w + 'px';
        beforeImg.style.height = h + 'px';
        afterImg.style.width = w + 'px';
        afterImg.style.height = h + 'px';
      }
    }
    window.addEventListener('resize', syncExactDimensions);

    uploadTrigger.addEventListener('click', () => {
      fileInput.value = '';
      fileInput.click();
    });

    function runRestore() {
      if (!loadedImageObj) return;
      restoredA4DataUrl = processWorksheetCanvas(loadedImageObj, {
        removeRed: document.getElementById('opt-red').checked,
        removePencil: document.getElementById('opt-pencil').checked,
        pureWhite: document.getElementById('opt-white').checked,
      });

      beforeImg.src = originalA4DataUrl;
      afterImg.src = restoredA4DataUrl;

      singlePreview.classList.add('hidden');
      compareContainer.classList.remove('hidden');
      requestAnimationFrame(syncExactDimensions);
      actionBar.classList.remove('hidden');
      statusBadge.textContent = '✨ 還原完成！左右滑動對比移除前後效果';
    }

    ['opt-red', 'opt-pencil', 'opt-white'].forEach((id) => {
      document.getElementById(id).addEventListener('change', () => {
        if (!compareContainer.classList.contains('hidden')) {
          runRestore();
        }
      });
    });

    function handleFile(file) {
      if (!file) return;
      fileNameEl.textContent = '正在載入照片...';
      fileNameEl.classList.remove('hidden');

      const objectUrl = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        loadedImageObj = img;
        const origA4Canvas = fitImageToStandardA4Canvas(img);
        originalA4DataUrl = origA4Canvas.toDataURL('image/jpeg', 0.92);
        URL.revokeObjectURL(objectUrl);

        fileNameEl.textContent = '✅ 已載入：' + (file.name || '工作紙照片');
        emptyPlaceholder.classList.add('hidden');
        compareContainer.classList.add('hidden');
        actionBar.classList.add('hidden');
        singlePreview.src = originalA4DataUrl;
        singlePreview.classList.remove('hidden');
        restoreBtn.disabled = false;
        statusBadge.textContent = '已載入原圖，請點擊「一鍵還原空白工作紙」';
      };
      img.onerror = () => {
        URL.revokeObjectURL(objectUrl);
        alert('無法讀取此圖片格式，請截圖後再上傳');
      };
      img.src = objectUrl;
    }

    /**
     * 開源結構化試卷擦除演算法：
     * 1. YCbCr 色度空間分離 + 5x5 形態學膨脹：精準移除老師紅筆打叉 (✗)、剔號 (√)、藍筆批改
     * 2. Sauvola 自適應局部二值化 + 8-連通域幾何特徵分析 (CCA)：
     *    - 識別手畫大圓圈（寬度大、空心度高）並整圈擦除，保留圈內印刷字
     *    - 識別手寫鉛筆筆劃（局部墨水濃度低於印刷油墨、筆劃梯度較平緩）並整塊抹除
     *    - 原有深黑印刷文字、題號、橫線與插圖 100% 保留原始粗細與對比度
     */
    function processWorksheetCanvas(img, opts) {
      const maxDim = 1600;
      let w = img.width, h = img.height;
      if (w > maxDim || h > maxDim) {
        if (w > h) { h = Math.round((h * maxDim) / w); w = maxDim; }
        else { w = Math.round((w * maxDim) / h); h = maxDim; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);

      const imgData = ctx.getImageData(0, 0, w, h);
      const d = imgData.data;
      const total = w * h;

      // 步驟 1：YCbCr 色度分離移除紅筆/藍筆批改（結合 5x5 形態學膨脹消除紅筆外圍光暈）
      if (opts.removeRed) {
        const chromaMask = new Uint8Array(total);
        for (let p = 0; p < total; p++) {
          const i = p * 4;
          const r = d[i], g = d[i + 1], b = d[i + 2];
          // YCbCr 色度差計算
          const cb = -0.1687 * r - 0.3313 * g + 0.5 * b;
          const cr = 0.5 * r - 0.4187 * g - 0.0813 * b;
          const chromaDist = Math.hypot(cb, cr);
          if (chromaDist > 11 && (cr > 6 || cb > 8 || (r - g > 12))) {
            chromaMask[p] = 1;
          }
        }
        // 5x5 形態學膨脹（半徑 2 像素），徹底包覆紅筆打叉與剔號邊緣
        const dilatedChroma = new Uint8Array(total);
        for (let y = 2; y < h - 2; y++) {
          for (let x = 2; x < w - 2; x++) {
            const p = y * w + x;
            if (chromaMask[p]) {
              for (let dy = -2; dy <= 2; dy++) {
                const rowOff = (y + dy) * w;
                for (let dx = -2; dx <= 2; dx++) {
                  dilatedChroma[rowOff + x + dx] = 1;
                }
              }
            }
          }
        }
        for (let p = 0; p < total; p++) {
          if (dilatedChroma[p]) {
            const i = p * 4;
            d[i] = 255; d[i + 1] = 255; d[i + 2] = 255;
          }
        }
      }

      // 步驟 2：計算灰階亮度與局部紙張背景基準（積分圖快速均值）
      const gray = new Float32Array(total);
      for (let p = 0; p < total; p++) {
        const i = p * 4;
        gray[p] = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
      }

      const gridSize = 32;
      const gw = Math.ceil(w / gridSize);
      const gh = Math.ceil(h / gridSize);
      const localBg = new Float32Array(gw * gh);

      for (let gy = 0; gy < gh; gy++) {
        for (let gx = 0; gx < gw; gx++) {
          let maxLum = 150;
          const startY = gy * gridSize;
          const endY = Math.min(h, startY + gridSize);
          const startX = gx * gridSize;
          const endX = Math.min(w, startX + gridSize);
          for (let y = startY; y < endY; y += 2) {
            for (let x = startX; x < endX; x += 2) {
              const v = gray[y * w + x];
              if (v > maxLum) maxLum = v;
            }
          }
          localBg[gy * gw + gx] = maxLum;
        }
      }

      // 計算每個像素相對於局部紙張底色的「墨水深度（Ink Darkness = 1 - gray/paperWhite）」
      const inkDepth = new Float32Array(total);
      const foregroundMask = new Uint8Array(total);

      for (let y = 0; y < h; y++) {
        const gy = Math.floor(y / gridSize);
        for (let x = 0; x < w; x++) {
          const p = y * w + x;
          const gx = Math.floor(x / gridSize);
          const paperWhite = localBg[gy * gw + gx];
          const depth = Math.max(0, 1 - gray[p] / Math.max(1, paperWhite));
          inkDepth[p] = depth;
          // 凡是比紙張暗 12% 以上的像素（包含鉛筆、圈選、印刷文字、插圖）納入前景候選
          if (depth > 0.12) {
            foregroundMask[p] = 1;
          }
        }
      }

      // 步驟 3：8-連通域幾何特徵分析 (Connected Component Analysis)
      // 將前景分離成獨立筆劃/字元區塊，精準判斷「手寫鉛筆字/手畫圓圈」並徹底抹除
      if (opts.removePencil) {
        const visited = new Uint8Array(total);
        const queue = new Int32Array(total);
        const eraseMask = new Uint8Array(total);

        const dx8 = [-1, 0, 1, -1, 1, -1, 0, 1];
        const dy8 = [-1, -1, -1, 0, 0, 1, 1, 1];

        for (let y = 0; y < h; y++) {
          for (let x = 0; x < w; x++) {
            const startP = y * w + x;
            if (!foregroundMask[startP] || visited[startP]) continue;

            let head = 0, tail = 0;
            queue[tail++] = startP;
            visited[startP] = 1;

            let minX = x, maxX = x, minY = y, maxY = y;
            let pixelCount = 0;
            let sumDepth = 0;
            let maxDepth = 0;
            let darkCoreCount = 0; // 統計真正接近印刷純黑核心 (depth > 0.56) 的像素數

            while (head < tail) {
              const curr = queue[head++];
              const cx = curr % w;
              const cy = (curr - cx) / w;

              if (cx < minX) minX = cx;
              if (cx > maxX) maxX = cx;
              if (cy < minY) minY = cy;
              if (cy > maxY) maxY = cy;

              const dp = inkDepth[curr];
              pixelCount++;
              sumDepth += dp;
              if (dp > maxDepth) maxDepth = dp;
              if (dp > 0.56) darkCoreCount++;

              for (let k = 0; k < 8; k++) {
                const nx = cx + dx8[k];
                const ny = cy + dy8[k];
                if (nx >= 0 && nx < w && ny >= 0 && ny < h) {
                  const np = ny * w + nx;
                  if (foregroundMask[np] && !visited[np]) {
                    visited[np] = 1;
                    queue[tail++] = np;
                  }
                }
              }
            }

            const boxW = maxX - minX + 1;
            const boxH = maxY - minY + 1;
            const boxArea = boxW * boxH;
            const fillRatio = pixelCount / Math.max(1, boxArea);
            const meanDepth = sumDepth / Math.max(1, pixelCount);
            const coreRatio = darkCoreCount / Math.max(1, pixelCount);

            // 排除整行印刷長橫線（寬度極長且高度極扁，例如 boxW > 110 且 boxH <= 8）
            const isPrintedLine = (boxW > 110 && boxH <= 9 && fillRatio > 0.35);
            // 排除大型插圖外框（面積極大且有高密度純黑核心）
            const isLargeIllustration = (boxW > 140 && boxH > 140 && coreRatio > 0.22);

            let shouldErase = false;

            if (!isPrintedLine && !isLargeIllustration) {
              // 特徵 A：手畫圈選（圍繞單字的圓圈/橢圓：寬度大於 42px、高度大於 18px、空心佔空比低於 0.22）
              const isHandDrawnCircle = (boxW >= 42 && boxH >= 18 && boxW <= 260 && boxH <= 120 && fillRatio < 0.22 && coreRatio < 0.35);

              // 特徵 B：手寫鉛筆字跡（平均墨水深度偏淺 meanDepth < 0.44，且缺乏印刷字體的純黑核心 coreRatio < 0.26）
              const isPencilHandwriting = (meanDepth < 0.44 && coreRatio < 0.26 && boxW < 240 && boxH < 120);

              // 特徵 C：極淺鉛筆殘影或塗改痕跡（最大深度未達印刷油墨標準 maxDepth < 0.54）
              const isFaintPencilMark = (maxDepth < 0.54 && pixelCount < 4500);

              if (isHandDrawnCircle || isPencilHandwriting || isFaintPencilMark) {
                shouldErase = true;
              }
            }

            if (shouldErase) {
              for (let idx = 0; idx < tail; idx++) {
                eraseMask[queue[idx]] = 1;
              }
            }
          }
        }

        // 對被判定為手寫/圈選的區塊做 1 像素邊緣擴張擦除，確保不留任何石墨灰邊
        for (let y = 1; y < h - 1; y++) {
          for (let x = 1; x < w - 1; x++) {
            const p = y * w + x;
            if (
              eraseMask[p] ||
              eraseMask[p - 1] || eraseMask[p + 1] ||
              eraseMask[p - w] || eraseMask[p + w]
            ) {
              const i = p * 4;
              d[i] = 255; d[i + 1] = 255; d[i + 2] = 255;
              foregroundMask[p] = 0;
            }
          }
        }
      }

      // 步驟 4：純白省墨背景提亮，同時 100% 原樣保留並加固剩餘的印刷文字、底線與插圖
      if (opts.pureWhite) {
        for (let y = 0; y < h; y++) {
          const gy = Math.floor(y / gridSize);
          for (let x = 0; x < w; x++) {
            const p = y * w + x;
            const i = p * 4;
            if (!foregroundMask[p]) {
              // 紙張背景轉 100% 純白
              d[i] = 255; d[i + 1] = 255; d[i + 2] = 255;
            } else {
              // 保留下來的印刷文字與插圖：按紙張底色做無損對比校準，絕不變淺或斷裂
              const gx = Math.floor(x / gridSize);
              const paperWhite = localBg[gy * gw + gx];
              const scale = 255 / Math.max(1, paperWhite * 0.94);
              // 對印刷黑字稍微增強濃度，保持銳利清晰
              const nr = Math.min(255, Math.round(d[i] * scale));
              const ng = Math.min(255, Math.round(d[i + 1] * scale));
              const nb = Math.min(255, Math.round(d[i + 2] * scale));
              d[i] = nr < 170 ? Math.max(0, Math.round(nr * 0.78)) : nr;
              d[i + 1] = ng < 170 ? Math.max(0, Math.round(ng * 0.78)) : ng;
              d[i + 2] = nb < 170 ? Math.max(0, Math.round(nb * 0.78)) : nb;
            }
          }
        }
      }

      ctx.putImageData(imgData, 0, 0);

      const finalA4Canvas = fitImageToStandardA4Canvas(canvas);
      return finalA4Canvas.toDataURL('image/png');
    }

    function dataUrlToBlob(dataUrl) {
      const arr = dataUrl.split(',');
      const mime = arr[0].match(/:(.*?);/)[1];
      const bstr = atob(arr[1]);
      let n = bstr.length;
      const u8arr = new Uint8Array(n);
      while (n--) u8arr[n] = bstr.charCodeAt(n);
      return new Blob([u8arr], { type: mime });
    }

    function triggerDownloadBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 5000);
    }

    function buildSinglePageA4Pdf() {
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
      pdf.addImage(restoredA4DataUrl, 'PNG', 0, 0, 210, 297);
      return pdf;
    }

    fileInput.addEventListener('change', (e) => handleFile(e.target.files[0]));
    restoreBtn.addEventListener('click', runRestore);

    let isDragging = false;
    function updateSlider(clientX) {
      const rect = compareContainer.getBoundingClientRect();
      let pct = ((clientX - rect.left) / rect.width) * 100;
      pct = Math.max(0, Math.min(100, pct));
      beforeClip.style.width = pct + '%';
      sliderLine.style.left = pct + '%';
    }
    compareContainer.addEventListener('mousedown', () => isDragging = true);
    window.addEventListener('mouseup', () => isDragging = false);
    window.addEventListener('mousemove', (e) => { if (isDragging) updateSlider(e.clientX); });
    compareContainer.addEventListener('touchmove', (e) => updateSlider(e.touches[0].clientX));

    // 1. 儲存標準 A4 PNG（圖片檔使用原生選單存入相簿）
    document.getElementById('download-png-btn').addEventListener('click', async () => {
      if (!restoredA4DataUrl) return;
      const blob = dataUrlToBlob(restoredA4DataUrl);
      const file = new File([blob], '空白練習工作紙_A4.png', { type: 'image/png' });

      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({ files: [file] });
          return;
        } catch (err) {
          if (err.name === 'AbortError') return;
        }
      }
      triggerDownloadBlob(blob, '空白練習工作紙_A4.png');
    });

    // 2. 匯出標準 A4 PDF（使用 application/octet-stream 強制觸發單一 PDF 檔案下載）
    document.getElementById('download-pdf-btn').addEventListener('click', () => {
      if (!restoredA4DataUrl) return;
      const pdf = buildSinglePageA4Pdf();
      const rawBuffer = pdf.output('arraybuffer');
      const forceDownloadBlob = new Blob([rawBuffer], { type: 'application/octet-stream' });
      triggerDownloadBlob(forceDownloadBlob, '空白練習工作紙_A4.pdf');
    });

    // 3. 直接列印 A4（透過標準單頁 A4 PDF 喚起系統列印，100% 鎖定只有「頁面 1/1」）
    document.getElementById('print-btn').addEventListener('click', () => {
      if (!restoredA4DataUrl) return;
      const pdf = buildSinglePageA4Pdf();
      const pdfBlob = pdf.output('blob');
      const blobUrl = URL.createObjectURL(pdfBlob);

      const frame = document.getElementById('pdf-print-frame');
      frame.onload = () => {
        try {
          frame.contentWindow.focus();
          frame.contentWindow.print();
        } catch (e) {
          const printImg = document.getElementById('print-img');
          printImg.src = restoredA4DataUrl;
          setTimeout(() => window.print(), 150);
        }
      };
      frame.src = blobUrl;
    });
  </script>
</body>
</html>
